[project]
name = "scivis-2025"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "pandas>=2.2",
    "scikit-learn>=1.7,<1.8",
    "torch>=2.7.1",
    "umap-learn>=0.5.9.post2",
    "cudf-cu12==25.6.*",
    "cuml-cu12==25.6.*",
    "openpyxl>=3.1.5",
    "seaborn>=0.13.2",
    "uvicorn>=0.40.0",
    "torchmetrics>=1.8.2",
    "gpytorch>=1.15.1",
]

[tool.uv.sources]
 cudf-cu12 = { index = "nv" }
 cuml-cu12 = { index = "nv" }

[[tool.uv.index]]
# Optional name for the index.
name = "nv"
# Required URL for the index.
url = "https://pypi.nvidia.com"

