server {

  listen 80;
  # rewrite *./assets/ to /assets/ for correct asset loading

  location ~ ^(.+)/assets/([^/]+) {
    root   /usr/share/nginx/html;
    rewrite ^/[^/]+(/assets/.*)$ $1$2 break;

  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}
